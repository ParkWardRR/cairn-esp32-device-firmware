; Cairn v2 firmware — Freematics ONE+ Model B (classic ESP32, WROVER + PSRAM).
;
; Framework note. The plan called for "an ESP-IDF application with
; arduino-esp32 as a component". On espressif32 7.x the Arduino core *is* an
; ESP-IDF 5.x component bundle, so `framework = arduino` already exposes every
; IDF API this firmware needs — esp_ota_ops for A/B slots, nvs_flash,
; esp_sleep for the real wake cause, esp_rom_crc for the ROM CRC-32 the format
; specifies, esp_partition, esp_vfs_fat and mbedTLS. That delivers the substance
; of the decision without a separate multi-gigabyte framework download, and it
; keeps the vendored FreematicsPlus drivers working unchanged.
;
; The drivers are deliberately reused rather than rewritten: this repo's history
; already contains one custom HAL that was broken and replaced by the vendored
; library, plus a vendor bug where the IMU self-test was left permanently
; enabled. Rebuild the application, keep the proven hardware access.

[platformio]
default_envs = cairn

[env:cairn]
platform  = espressif32@7.1.3
board     = esp-wrover-kit
framework = arduino

board_build.f_cpu = 160000000L
; DIO, matching the mode docs/flashing-and-testing.md records for the W25Q128 on
; this unit. QIO would read marginally faster and is what the v1 config asked
; for, but a flash mode the board does not actually support fails as a boot loop
; rather than as a warning, and read speed is nowhere near a bottleneck here.
board_build.flash_mode = dio
board_build.partitions = partitions-ab.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; -O2 rather than -Os: the format's scan and CRC paths run over every frame on
; every boot recovery, and a slow recovery is a slow boot in a car.
build_unflags = -Os
build_flags =
    -O2
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-missing-field-initializers
    -DBOARD_HAS_PSRAM
    -DCAIRN_FIRMWARE_VERSION='"cairn-v2.0.0"'
    ; Route CRC-32 through ESP32 ROM. The specification chose the reflected
    ; IEEE polynomial over CRC32C precisely so this is available, and the host
    ; conformance run proves the ROM convention matches the portable fallback.
    -DCAIRN_USE_ESP_ROM_CRC
    ; board_config.h lives in include/ and is needed by the libraries too.
    -Iinclude
    ; Verbose by default. This build is for bench testing, where knowing what
    ; the device decided matters more than log volume.
    -DCORE_DEBUG_LEVEL=4
    -DCAIRN_LOG_LEVEL=5
    ; BLE is not optional: the dongle has no Wi-Fi, so the phone over BLE is the
    ; only way a bundle leaves it (contracts/ble/v1/offload.md). Needs CAIRN_BLE_PASSKEY in
    ; secrets.h.
    -DCAIRN_BLE_COMPANION=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1

build_src_filter = +<*>

; The vendored FreematicsPlus drivers are shared with the v1 firmware rather
; than copied. Reusing them is deliberate: a previous hand-rolled HAL in this
; repository was broken and replaced by exactly this library.
lib_extra_dirs = third_party/freematics-base/lib

; The only library dependency is NimBLE, for the BLE link to the phone. Everything
; on the wire is deterministic CBOR encoded by lib/cairn_format, so there is no
; JSON library to pull in.
lib_deps = h2zero/NimBLE-Arduino@^2.2.1
lib_ldf_mode = deep+

; Bench build: runs the boot self-test and a storage/format smoke check, prints
; the result over serial and to the SD log, then stops. Flash this first to
; confirm the hardware and the card before trusting a drive to it.
[env:cairn-selftest]
extends = env:cairn
build_flags =
    ${env:cairn.build_flags}
    -DCAIRN_SELFTEST=1

; Kept as an alias. BLE used to be an option; it is now in every build, because
; without Wi-Fi it is the only way data leaves the dongle.
[env:cairn-ble]
extends = env:cairn

; Network probe build. Scans Wi-Fi and prints every SSID with its exact length,
; then powers the BEE socket and talks raw AT to whatever is in it. Captures
; nothing, mounts nothing, writes no NVS. Flash it to answer "is a modem fitted
; and does the SIM register", which this repository has only ever recorded as
; unconfirmed, and to read an access point's name off the radio rather than off
; a note.
[env:cairn-netprobe]
extends = env:cairn
build_flags =
    ${env:cairn.build_flags}
    -DCAIRN_NETPROBE=1

; Wi-Fi upload bench. Mounts the card, joins the configured network, uploads
; the sealed bundles over mTLS to the ingest listener, prunes each one whose
; receipt verifies against the pinned key, and halts instead of capturing.
;
; Separate from env:cairn because it must not run in a car: it takes the radio
; and the card for minutes with no regard for the uplink schedule. Flash it to
; prove the Wi-Fi seam, then flash env:cairn back.
[env:cairn-wifiup]
extends = env:cairn
build_flags =
    ${env:cairn.build_flags}
    -DCAIRN_WIFI_UPLINK=1
    -DCAIRN_WIFIUP_TEST=1

; LTE upload bench. Brings the modem up, attaches, and uploads sealed bundles
; over cellular to the public Funnel ingress, through the ESP32's own mbedTLS
; rather than the modem's TLS stack. Halts instead of capturing.
;
; Like env:cairn-wifiup this must not run in a car: it holds the card and the
; modem for minutes with no regard for the uplink schedule.
[env:cairn-lteup]
extends = env:cairn
build_flags =
    ${env:cairn.build_flags}
    -DCAIRN_LTE_UPLINK=1
    -DCAIRN_LTEUP_TEST=1

; PID validation build. Captures exactly as `cairn` does, and additionally
; prints the Mode 01 support bitmaps plus, every five seconds, the raw ECU
; reply and the library's converted value for every PID the firmware reads.
;
; Flash this for a drive when a conversion is in doubt: the raw bytes are the
; only way to check the library's arithmetic against the standard formula
; instead of inferring it from source, which is how the equivalence-ratio scale
; error got in.
[env:cairn-pidtest]
extends = env:cairn
build_flags =
    ${env:cairn.build_flags}
    -DCAIRN_PIDTEST=1

; Manual-transmission discovery build. Captures exactly as `cairn` does and, on
; the sensing task, additionally asks the ECU for the Mode 01 support bitmaps and
; a rotating set of torque, pedal and gear candidates, logging raw replies under
; tag MTP. See src/mtprobe.cpp. Flash it for a drive; grep MTP over the log.
[env:cairn-mtprobe]
extends = env:cairn
build_flags =
    ${env:cairn.build_flags}
    -DCAIRN_MTPROBE=1

; The same, plus short passive CAN sniff windows. Separate because sniffing
; takes the OBD link out of request mode for two seconds at a time, and the
; recovery path has not met this adapter yet; run the plain probe first.
[env:cairn-mtprobe-sniff]
extends = env:cairn
build_flags =
    ${env:cairn.build_flags}
    -DCAIRN_MTPROBE=1
    -DCAIRN_MTPROBE_SNIFF=1
