name: Interop (latest server)

# DIAGNOSTIC, not a gate. The vehicle server's CI already runs the same script against a
# firmware revision it pins (that one is required there). This runs it the other way round
# each week: THIS firmware against the server's current main, so a server change that the
# pin has not caught up with shows up here before a release does.
#
# A red run here means "look", not "revert": decide whether the server or the firmware
# should move, and bump the server's interop.lock when the firmware is the one that did.
on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

jobs:
  interop:
    runs-on: [self-hosted, cairn]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pinned contracts
        run: scripts/fetch-contracts.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: The server's current main
        run: git clone --quiet --depth 1 https://github.com/ParkWardRR/cairn-vehicle-server.git .interop/server

      # Issue #8: the bytes the firmware's C WRITER produces, judged by the server's Go reader
      # (cairn-verify), plus a mutation check proving the judgement can fail. Needs the server
      # checkout, so it cannot be a firmware-repo CI job; the server's own required interop
      # job gets the same check by adding this to tests/interop/run.sh (server-side hook,
      # not made here):
      #     "$FW/scripts/interop-writer.sh" --server "$ROOT" --mutation-check
      - name: The C writer's bundles against the server's verifier
        run: scripts/interop-writer.sh --server .interop/server --mutation-check

      # Issue #12: the emulator's protocol rows as the PHONE, over /v1/relay/bundles/* (the
      # real path), plus the rows only the relay has (caller forgery and replay, reordering,
      # early commit, forged receipts and offers). Builds the server from the checkout into a
      # temporary directory; --selftest also proves the run can fail. Server-side hook for its
      # own required interop job (not made here), in tests/interop/run.sh:
      #     "$FW/scripts/relay-interop.sh" --server "$ROOT"
      - name: The emulator as the phone, against the relay
        run: scripts/relay-interop.sh --server .interop/server --selftest

      - name: This firmware against it
        working-directory: .interop/server
        run: INTEROP_FIRMWARE_DIR="${{ github.workspace }}" tests/interop/run.sh
