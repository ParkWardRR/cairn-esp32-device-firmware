[package]
name = "cairn-emulator"
version = "0.1.0"
edition = "2024"
description = "Cairn bundle-format conformance checker and fault-injection matrix"

[[bin]]
name = "cairn-emulator"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
ureq = { version = "2", features = ["json"] }
ed25519-dalek = "3.0.0"
crc32fast = "1.5.2"
chacha20poly1305 = "0.10"
hkdf = "0.12"

[profile.release]
lto = true
strip = true
opt-level = "z"
