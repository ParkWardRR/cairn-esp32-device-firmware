[package]
name = "cairn-emulator"
version = "0.1.0"
edition = "2024"
description = "Freematics ONE+ Model B device emulator for Cairn"

[[bin]]
name = "cairn-emulator"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"

[profile.release]
lto = true
strip = true
opt-level = "z"
