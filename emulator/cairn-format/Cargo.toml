[package]
name = "cairn-format"
version = "0.1.0"
edition = "2024"
description = "Cairn bundle format v3: segments, frames, manifests, receipts. no_std + alloc, for the emulator and for devices"
license-file = "../../LICENSE"
publish = false

[features]
default = []
# Nothing in the crate needs std; the feature exists for consumers that want
# std::error::Error on FormatError through core's re-export anyway.
std = []

[dependencies]
sha2 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = { version = "0.12", default-features = false }
crc32fast = { version = "1.5.2", default-features = false }
rand_core = { version = "0.6", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
rand = "0.8"
